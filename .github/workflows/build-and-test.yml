name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            configure_args: ""
          - name: Linux GCC
            os: ubuntu-latest
            configure_args: -DCMAKE_CXX_COMPILER=g++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
